upstream samm_assessment_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name assessment.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name assessment.example.com;
    server_tokens off;

    ssl_certificate /etc/ssl/certs/assessment-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/assessment.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 210m;
    client_body_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /static/ {
        alias /opt/samm-assessment/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://samm_assessment_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_redirect off;
    }

    location = /healthz {
        proxy_pass http://samm_assessment_backend/api/v1/health;
        access_log off;
    }
}
