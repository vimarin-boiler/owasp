services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: samm-assessment:0.6.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: sqlite:////app/instance/samm_assessment.db
      UPLOAD_FOLDER: /app/uploads
      BACKUP_FOLDER: /app/backups
      REPORT_FOLDER: /app/reports
      CATALOG_IMPORT_FOLDER: /app/instance/catalog_imports
      RUN_MIGRATIONS_ON_START: "true"
      RUN_SEED_ON_START: "false"
      GUNICORN_BIND: 0.0.0.0:8000
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
    volumes:
      - samm_instance:/app/instance
      - samm_uploads:/app/uploads
      - samm_backups:/app/backups
      - samm_reports:/app/reports
    expose:
      - "8000"
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

volumes:
  samm_instance:
  samm_uploads:
  samm_backups:
  samm_reports:
